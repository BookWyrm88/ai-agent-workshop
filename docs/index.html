<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
/* Runtime boundary: future providers implement plan(config, task) and return observable steps.
   The UI subscribes to events; it never invents progress or exposes model reasoning. */
(function (root) {
  const SAMPLE = 'Greenhouse sensor trial — QA field notes\n\nThe team tested 24 temperature sensors over seven days. Twenty-two sensors met the acceptance limit of ±0.5°C. Two sensors drifted beyond the limit after exposure to high humidity. Both failures came from batch B. The reference thermometer was calibrated before the trial. Humidity was not controlled, so the cause of the drift has not been confirmed. Quarantine batch B and repeat testing under controlled humidity before release. The trial lead will review the repeat results on Friday.';
  const split = text => { const parts=text.split(/\n\s*\n/);const body=parts.length>1?parts.slice(1).join(' '):text;return body.split(/(?<=[.!?])\s+(?=[A-Z])/).map(x=>x.trim()).filter(Boolean); };
  class SimulationProvider {
    plan(config, task, fail, input) {
      if(input?.kind==='research.result') {
        const output=String(input.output||'');
        const checks={hasResult:output.length>0,hasSourceLabel:/Source:/.test(output),mentionsUncertainty:/not controlled|not been confirmed|uncertain|limitation/i.test(output),sourceAttached:typeof input.sourceDocument==='string'&&input.sourceDocument.length>0};
        const review='Research review (deterministic simulation)\n\n'+Object.entries(checks).map(([name,pass])=>(pass?'PASS':'CHECK')+' · '+name).join('\n')+'\n\nReviewed '+output.length+' characters from task '+input.sourceTaskId+'. These fixed checks do not establish factual correctness. Human review is still needed.';
        return [
          {type:'task.started',state:'working',label:'Evaluation started',data:{provider:'Deterministic simulation',version:config.version}},
          {type:'evaluation.input',state:'using-tool',label:'Reading received research payload',data:{payload:input}},
          {type:'evaluation.checked',state:'working',label:'Fixed quality checks applied',data:{checks,method:'Presence checks against the actual received output; no model or external research'}},
          {type:'task.completed',state:'completed',label:'Evaluation completed',data:{output:review,checks,cost:0,modelTokens:null}}
        ];
      }
      const base = [{type:'task.started',state:'working',label:'Task received',data:{task,agent:config.name,version:config.version,provider:'Deterministic simulation'}}];
      if (!config.tool) return [...base,{type:'task.failed',state:'failed',label:'Document tool is disabled',data:{error:'Enable the Sample document tool in Blueprint, save, and retry. No document was read.'}}];
      const steps = [...base,{type:'tool.called',state:'using-tool',label:'Reading sample document',data:{tool:'sample_document.read',input:{document:'workshop-sample'},permission:'Local sample only'}}];
      if(fail) return [...steps,{type:'tool.failed',state:'failed',label:'Simulated document read failure',data:{error:'Intentional practice failure. Retry to run again; no external service was contacted.'}}];
      const text=config.document || SAMPLE;
      steps.push({type:'tool.result',state:'working',label:'Document received',data:{tool:'sample_document.read',output:text,characters:text.length}});
      const sentences=split(text); const detailed=config.format==='detailed'||/detailed/i.test(config.instructions);
      let chosen=sentences.slice(0,detailed?7:3);
      if(/risk|uncertain|limitation/i.test(config.instructions)) {
        const risk=sentences.find(s=>/not confirmed|not been confirmed|uncertain|not controlled|limitation|risk/i.test(s));
        if(risk&&!chosen.includes(risk)) chosen.push(risk);
      }
      if(/next steps?/i.test(config.instructions)) {
        const next=sentences.find(s=>/quarantine|repeat|must|should|next/i.test(s));
        if(next&&!chosen.includes(next))chosen.push(next);
      }
      let output;
      if(/checklist|action|next step/i.test(task)) output='Action checklist (simulated)\n\n'+sentences.filter(s=>/quarantine|repeat|review|must|should|next/i.test(s)).map(s=>'☐ '+s).join('\n');
      else if(/summari|summary|explain|document|sensor|report|trial/i.test(task)) output=(detailed?'Detailed summary':'Concise summary')+' (simulated)\n\n'+chosen.map(s=>(/bullet/i.test(config.instructions)||detailed?'• ':'')+s).join(detailed?'\n':' ')+'\n\nSource: the sample document. This is a rule-based extract, not a model-generated answer.';
      else output='This simulation can summarize the sample document or extract an action checklist. Try “Summarize the sample document” or “Create an action checklist.” Open Blueprint to change the document, output style, and supported instruction cues (bullets and risks). General conversation requires a future model integration.';
      steps.push({type:'output.created',state:'working',label:'Preparing response',data:{method:'Deterministic sentence extraction',format:config.format,instructions:config.instructions}});
      steps.push({type:'task.completed',state:'completed',label:'Task completed',data:{output,cost:0,modelTokens:null}});
      return steps;
    }
  }
  class AgentRuntime {
    constructor(provider=new SimulationProvider(),delay=750){this.provider=provider;this.delay=delay;this.listeners=new Set();this.active=null;}
    subscribe(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn);}
    emit(step){const event={...step,id:crypto.randomUUID(),runId:this.active.id,at:new Date().toISOString()};this.listeners.forEach(fn=>fn(event));}
    start(id,config,task,fail=false,input){if(this.active) throw Error('A run is already active');this.active={id,steps:this.provider.plan(config,task,fail,input),index:0,paused:false};this.tick();}
    tick(){if(!this.active||this.active.paused)return;const a=this.active;const step=a.steps[a.index++];if(!step)return;this.emit(step);if(['completed','failed'].includes(step.state)){this.active=null;return;}this.timer=setTimeout(()=>this.tick(),this.delay);}
    pause(){if(!this.active||this.active.paused)return;clearTimeout(this.timer);this.active.paused=true;this.emit({type:'task.paused',state:'paused',label:'Paused by you',data:{message:'The simulation will wait until you resume.'}});}
    resume(){if(!this.active?.paused)return;this.active.paused=false;this.emit({type:'task.resumed',state:'working',label:'Resumed by you',data:{}});this.timer=setTimeout(()=>this.tick(),this.delay);}
    cancel(){if(!this.active)return;clearTimeout(this.timer);this.emit({type:'task.cancelled',state:'cancelled',label:'Cancelled by you',data:{}});this.active=null;}
  }
  root.WorkshopCore={SAMPLE,SimulationProvider,AgentRuntime};
})(typeof window!=='undefined'?window:globalThis);

</script><script>
/* Persistent visual identity. Shared by the room, editor, conversation and traces. */
window.WorkshopIdentity = (() => {
  const palette = [
    {name:'Poppy red',value:'#c94e63'}, {name:'Marigold orange',value:'#de8735'},
    {name:'Sunflower yellow',value:'#d4ac30'}, {name:'Moss green',value:'#569773'},
    {name:'Sky blue',value:'#4e94c5'}, {name:'Twilight indigo',value:'#6c6bb5'},
    {name:'Orchid violet',value:'#a96bb4'}
  ];
  const shapes=[{id:'round',name:'Round companion'},{id:'square',name:'Boxy explorer'},{id:'cat',name:'Cat-eared scout'}];
  const accessories=[{id:'sprout',name:'Sprout'},{id:'antenna',name:'Antenna'},{id:'star',name:'Star'},{id:'none',name:'No accessory'}];
  const symbols=['✿','◆','★','☀','☾','✦','♥'];
  const validColor=value=>/^#[0-9a-f]{6}$/i.test(value||'');
  function ink(color){const hex=validColor(color)?color:'#569773';const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.179?'#000000':'#ffffff';}
  function defaults(name,index=0){index=Math.max(0,index);const moss=/^moss$/i.test(name),herman=/^herman$/i.test(name);return {color:moss?palette[3].value:herman?palette[1].value:palette[[3,1,4,6,0,2,5][index%7]].value,avatar:moss?'round':herman?'square':shapes[index%3].id,accessory:moss?'sprout':herman?'antenna':accessories[index%4].id,symbol:moss?'✿':herman?'◆':symbols[index%7],provider:'simulation',model:'extractive-v1',memory:'history-only'};}
  function normalize(a,index=0){const d=defaults(a.name,index);return {...d,...a,color:validColor(a.color)?a.color:d.color,avatar:shapes.some(s=>s.id===a.avatar)?a.avatar:d.avatar,accessory:accessories.some(s=>s.id===a.accessory)?a.accessory:d.accessory,symbol:symbols.includes(a.symbol)?a.symbol:d.symbol,provider:'simulation',model:'extractive-v1',memory:'history-only'};}
  function style(a){return `--agent:${a.color};--agent-ink:${ink(a.color)}`;}
  function bot(a){const themed=window.WorkshopTheme?.avatar(a);if(themed)return themed;const color=validColor(a.color)?a.color:'#569773';let top='';

    if(a.accessory==='antenna')top='<path d="M45 22V10" stroke="#4b5061" stroke-width="3"/><circle cx="45" cy="7" r="5" fill="#f7cf6c" stroke="#685c48" stroke-width="1.5"/>';
    if(a.accessory==='star')top='<path d="m45 2 4 8 9 1-7 6 2 9-8-4-8 4 2-9-7-6 9-1z" fill="#f5cc6b" stroke="#886b3e" stroke-width="1.3"/>';
    const ears=a.avatar==='cat'?`<path d="m18 31-3-20 21 15m20 0 20-15-3 21" fill="${color}" stroke="#48515c" stroke-width="2"/>`:'';
    return `<svg class="bot avatar-${a.avatar}" viewBox="0 0 90 103" aria-hidden="true">${top}${ears}<path d="M30 86v9M60 86v9" stroke="#727b8a" stroke-width="9" stroke-linecap="round"/><rect x="24" y="63" width="43" height="26" rx="${a.avatar==='square'?5:10}" fill="#e2d9c5" stroke="#7e8078" stroke-width="1.4"/><path d="M24 70 13 80M68 70l10 10" stroke="#cbc4b2" stroke-width="8" stroke-linecap="round"/><rect x="17" y="22" width="58" height="45" rx="${a.avatar==='square'?7:17}" fill="${color}" stroke="#48515c" stroke-width="1.7"/><path d="M25 27q20-7 41 0" stroke="white" opacity=".25" fill="none" stroke-width="3"/><rect x="24" y="33" width="44" height="24" rx="${a.avatar==='square'?4:10}" fill="#263d49"/><g class="eyes" fill="#fff4d7"><rect x="33" y="40" width="5" height="7" rx="2.5"/><rect x="54" y="40" width="5" height="7" rx="2.5"/></g><path d="M43 50q3 3 6 0" fill="none" stroke="#fff4d7" stroke-width="1.5"/><circle cx="46" cy="77" r="6" fill="${color}"/><text x="46" y="80" text-anchor="middle" fill="${ink(color)}" font-size="8">${symbols.includes(a.symbol)?a.symbol:'✿'}</text></svg>`;
  }
  function fields(a,esc){return `<div class="identity-editor"><div class="avatar-preview" style="${style(a)}">${bot(a)}<span>Appearance preview</span></div><div class="identity-options"><div class="form-pair"><label class="field">Avatar shape<select name="avatar">${shapes.map(s=>`<option value="${s.id}" ${a.avatar===s.id?'selected':''}>${s.name}</option>`).join('')}</select></label><label class="field">Accessory<select name="accessory">${accessories.map(s=>`<option value="${s.id}" ${a.accessory===s.id?'selected':''}>${s.name}</option>`).join('')}</select></label></div><label class="field">Identity symbol<select name="symbol">${symbols.map(s=>`<option ${a.symbol===s?'selected':''}>${s}</option>`).join('')}</select></label></div></div><fieldset class="color-field"><legend>Agent color</legend><div class="swatches">${palette.map(c=>`<button type="button" class="swatch ${a.color.toLowerCase()===c.value?'chosen':''}" data-color="${c.value}" style="--swatch:${c.value};--swatch-ink:${ink(c.value)}" aria-label="${c.name}" aria-pressed="${a.color.toLowerCase()===c.value}" title="${c.name}">${a.color.toLowerCase()===c.value?'✓':''}</button>`).join('')}<label class="custom-color">Custom<input name="color" type="color" aria-label="Custom agent color" value="${esc(a.color)}"></label></div><p class="field-help">Color + name + shape + symbol keep every agent recognizable.</p></fieldset>`;}
  function room(agents,selected,statusOf,esc,zoom=1){return `<div class="shared-room" aria-label="Shared illustrated workshop"><div class="room-scroll" tabindex="0" aria-label="Scrollable workshop; all agents have their own workstation"><div class="room-world" style="zoom:${zoom};min-width:${agents.length>2?710:510}px"><div class="studio-wall"><span class="studio-sign">THE SPECTRUM STUDIO <small>Room for every kind of curious.</small></span><svg viewBox="0 0 800 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="800" height="150" fill="#e9e1d9"/><path d="M0 148h800" stroke="#b6a997" stroke-width="5"/><rect x="42" y="24" width="125" height="110" rx="40" fill="#8c9da1"/><path d="M49 128V65a55 35 0 0 1 111 0v63z" fill="#bfdbe0"/><circle cx="129" cy="53" r="15" fill="#fff0b3"/><path d="M49 106q25-45 58-10 31-34 53-7v39H49" fill="#98b7a0"/><path d="M49 117q38-25 68-6 28-18 43-3v20H49" fill="#71977e"/><path d="M105 29v99M49 80h111" stroke="#879b9b" stroke-width="5"/><rect x="31" y="130" width="148" height="8" rx="4" fill="#ae997f"/><path d="M601 64h147v8H601M601 121h147v8H601" fill="#ad987b"/><path d="M612 63V34h10v29M628 63V29h9v34M643 63V38h11v25" stroke="#a56c90" stroke-width="7"/><path d="M618 120V91h8v29M633 120V86h10v34M648 120V95h9v25" stroke="#5c8da6" stroke-width="7"/><path d="M663 120V89h9v31" stroke="#c79b50" stroke-width="6"/><rect x="701" y="40" width="21" height="23" rx="3" fill="#c6956f"/><path d="M712 42v-24m0 13q-19-5-10-18 13 2 10 18m0-8q4-19 18-14 0 14-18 14" fill="#69937b"/><rect x="701" y="99" width="27" height="21" rx="3" fill="#b8aa86"/><path d="M714 100q-20-10-12-22 12 1 12 22m0-1q-3-21 14-24 8 18-14 24" fill="#8aa46f"/><path d="M203 18q198 48 384 0" fill="none" stroke="#a5a0a0" stroke-width="2"/>${palette.map((c,i)=>`<path d="m${220+i*52} ${21+Math.sin(i/6*Math.PI)*17} 18 3-11 23z" fill="${c.value}"/>`).join('')}<rect x="233" y="77" width="44" height="54" rx="2" fill="#bb9c7e"/><rect x="237" y="81" width="36" height="46" fill="#f2dfac"/><path d="M245 117q17-34 22-20" stroke="#a96bb4" stroke-width="4" fill="none"/><rect x="526" y="75" width="43" height="55" rx="3" fill="#a39c92"/><rect x="530" y="79" width="35" height="47" fill="#f3e5c6"/><circle cx="548" cy="99" r="10" fill="#de8735"/><path d="M535 119q10-14 25-2" stroke="#569773" stroke-width="4" fill="none"/></svg></div><div class="station-grid" style="--columns:${agents.length>2?3:2}">${agents.map(a=>{const s=statusOf(a.id);const active=['working','using-tool'].includes(s);const label=s==='using-tool'?'Using tool':s==='paused'?'Waiting · paused':s==='cancelled'?'Idle · cancelled':s;return `<button class="station ${s} ${a.id===selected?'selected':''}" data-select-agent="${a.id}" data-agent-name="${esc(a.name)}" style="${style(a)}" aria-pressed="${a.id===selected}" aria-label="Select ${esc(a.name)}, ${label}"><span class="selection-marker">${a.id===selected?'✓ Selected':'Click to select'}</span><span class="station-figure">${bot(a)}${active?'<span class="activity-pips"><i></i><i></i><i></i></span>':''}</span><svg class="desk-art" viewBox="0 0 240 105" aria-hidden="true"><ellipse cx="122" cy="95" rx="100" ry="9" fill="#8e7d791c"/><path d="M38 55v42m162-42v42" stroke="#9d846b" stroke-width="8"/><path d="M20 39h200l10 15H10z" fill="#d0b798"/><path d="M10 54h220v9H10z" fill="#b59a7d"/><path d="M14 59h212" stroke="${a.color}" stroke-width="5"/><rect x="32" y="5" width="49" height="34" rx="3" fill="#455a65"/><rect x="36" y="9" width="41" height="25" rx="2" fill="#d9e2df"/><path d="M41 16h25M41 22h16M41 28h21" stroke="${a.color}" stroke-width="2"/><path d="M57 39v7m-11 0h22" stroke="#5f6b71" stroke-width="3"/><path d="M39 50h41l5 3H35z" fill="#f4ecd9"/><rect x="174" y="25" width="19" height="18" rx="3" fill="${a.color}"/><path d="M193 29q10-1 7 9h-7" stroke="${a.color}" fill="none" stroke-width="3"/><path d="M151 40V13l-11-8" stroke="#777b69" stroke-width="3" fill="none"/><path d="M129 11q-3-14 12-11l9 8z" fill="#e2b566"/><path d="M208 39h15l-2-16h-11z" fill="#ab80a7"/><path d="M215 24v-15m0 10q-13-2-10-12 11 0 10 12m0-5q2-13 12-9 0 10-12 9" fill="#79a07a"/></svg><span class="station-name"><b>${a.symbol}</b> ${esc(a.name)}</span><span class="station-status"><span class="status-dot"></span>${label}</span></button>`;}).join('')}</div><div class="room-bottom">✿ Independent agents, one shared creative space. <span>No collaboration is simulated.</span></div></div></div></div>`;}

/* Persistence boundary. No timers, network calls, credentials, or UI dependencies. */
window.WorkshopData = (() => {

  function creationDialog(){const c=state.ui.creation;if(!c)return '';const a=c.agent;const phase=c.phase||0;return `<div class="dialog-backdrop"><section class="dialog create-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-heading"><div><div class="eyebrow">New identity · existing agents stay unchanged</div><h2 id="dialog-title">Create New Agent</h2></div><button class="link" data-action="close-modal" aria-label="Close and keep draft">×</button></div><div class="creation-progress"><span class="${phase===0?'current':''}">1 · Identity</span><span class="${phase===1?'current':''}">2 · Instructions & tools</span><span class="${phase===2?'current':''}">3 · Review & create</span></div>${liveTutorial()?`<div class="dialog-guidance"><strong>Lesson ${steps[state.tutorial.step]?.lesson||2}: ${steps[state.tutorial.step]?.title||'Create your agent'}</strong><p>${steps[state.tutorial.step]?.text||''}</p></div>`:''}${liveTutorial()?'<div class="guide-controls"><button data-action="skip-step">Skip Step →</button><button data-action="tutorial-help">I’m stuck</button><button data-action="skip-tutorial">Exit tutorial</button></div>':''}<form id="create-form">${phase===0?`<label class="field">Agent name<input id="new-agent-name" name="name" type="text" maxlength="32" required placeholder="e.g. Herman" autocomplete="off" value="${esc(a.name)}"></label>${identity.fields(a,esc)}`:phase===1?`<div class="draft-identity" style="${style(a)}">${bot(a)}<div><strong>${esc(a.name)}</strong><p>New agent draft · not created yet</p></div></div><label class="field">Role<input name="role" type="text" maxlength="80" required value="${esc(a.role)}"></label><label class="field">Instructions<textarea name="instructions" rows="3" maxlength="2000" required>${esc(a.instructions)}</textarea><small>Try “Use bullets.” and “Include risks and uncertainty.” These are supported simulation cues.</small></label><label class="checkbox-row"><input type="checkbox" name="tool" ${a.tool?'checked':''}>Enable Sample document tool</label><p class="field-help">Read-only access to this agent’s sample text. No access to your files or accounts.</p><details class="advanced-settings"><summary>Advanced settings · provider, model & memory</summary>${advancedSettings(a)}</details>`:`<div class="review-agent" style="${style(a)}">${bot(a)}<h3>${a.symbol} ${esc(a.name)}</h3><p>${esc(a.role)}</p></div><dl class="review-list"><dt>Appearance</dt><dd>${esc(identity.shapes.find(x=>x.id===a.avatar).name)} · ${esc(identity.accessories.find(x=>x.id===a.accessory).name)}</dd><dt>Instructions</dt><dd>${esc(a.instructions)}</dd><dt>Tool access</dt><dd>${a.tool?'Sample document · read only':'No tools enabled'}</dd><dt>Execution</dt><dd>Simulation · no API costs</dd></dl><p class="field-help">Create Agent adds a new workstation and saves this agent independently. It does not rename or replace Moss or anyone else.</p>`}<p id="create-error" class="error-inline" role="alert"></p><div class="form-actions"><button type="button" data-action="${phase?'create-back':'close-modal'}">${phase?'Back':'Close · keep draft'}</button><button class="primary" type="submit" id="create-next">${['Continue to instructions →','Review agent →','Create Agent'][phase]}</button></div></form></section></div>`;}

  function workshop(){const a=agent(),r=latest();const msgs=state.messages.filter(m=>m.agentId===a.id&&m.sessionId===a.sessionId);return `<div class="workspace-grid"><div><section class="panel"><div class="panel-head"><h2>Your workshop <span class="muted" style="font-size:11px;font-weight:400;margin-left:8px">${state.agents.filter(a=>a.lifecycle==='active').length} active ${state.agents.length===1?'agent':'agents'}</span></h2><select class="agent-switch" id="agent-select" aria-label="Active agent">${state.agents.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${room()}<div class="scene-footer"><span><span class="live-dot"></span>Simulation environment</span><label class="zoom-control">Room scale <select id="room-zoom" aria-label="Room scale"><option value="1" ${state.ui.zoom===1?'selected':''}>100%</option><option value="0.85" ${state.ui.zoom===.85?'selected':''}>85%</option><option value="0.7" ${state.ui.zoom===.7?'selected':''}>70%</option></select></label></div><div class="agent-row"><div class="agent-mini">${bot()}</div><div class="agent-info"><h3>${a.symbol} ${esc(a.name)} <small>· Selected agent</small></h3><p>${esc(a.role)} · configuration v${a.version}</p></div><span class="status-tag ${status()}">${status().replace('-',' ')}</span><button class="small" data-view="blueprint">Edit agent</button></div></section><div class="under-workshop"><div class="stat-card"><div class="eyebrow">Learning through doing</div><div class="value">${runs().filter(r=>r.status==='completed').length} <span style="font-size:12px;color:var(--muted)">completed runs</span></div><p>Every run has a trace you can inspect.</p></div><div class="stat-card"><div class="eyebrow">A safe place to experiment</div><div class="value">$0.00 <span style="font-size:12px;color:var(--muted)">API spend</span></div><p>Simulated responses. No API connection.</p></div></div></div><section class="panel chat identity-accent"><div class="panel-head"><div><h2>${a.symbol} Chat with ${esc(a.name)}</h2><div class="sub"><span class="live-dot"></span>${busy()?'Run in progress':'Ready to explore'}</div></div><span class="pill">Simulation</span></div><div class="chat-messages" id="messages" role="log" aria-label="Agent conversation">${msgs.length?msgs.map(m=>`<div class="chat-message ${m.role}"><div class="who">${m.role==='user'?'You':esc(a.name)}${m.role==='agent'?'<span class="sim-label">SIMULATED</span>':''}<span class="time">${time(m.at)}</span></div><div class="message">${esc(m.text)}</div></div>`).join(''):`<div class="empty-chat">${bot()}<h3>Hello, I’m ${esc(a.name)}.</h3><p>Let’s turn a document into something useful. Give me a task and watch how the pieces work together.</p><p>This sandbox uses scripted responses.<br>No model or account is connected.</p></div>`}</div><form id="task-form" class="composer"><div class="prompt-chips"><button type="button" data-prompt="Summarize the sample document">Summarize document</button><button type="button" data-prompt="Create an action checklist from the sample document">Make a checklist</button></div><div class="input-wrap"><textarea id="task-input" aria-label="Task for your agent" placeholder="What would you like to explore?" maxlength="2000" >${esc(chatDraft())}</textarea><div class="send-row"><span>Enter to send · Shift + Enter for a new line</span><button type="submit" class="primary${highlight('send')}" >${busy()?'Queue task':'Run task'} ↑</button></div></div><div class="error-inline" id="task-error" role="alert"></div></form></section></div>${collaborationPanel()}${tutorial()}<section class="panel activity-panel"><div class="panel-head"><h2>${a.symbol} ${esc(a.name)}’s activity</h2><div class="run-controls">${busy()?`<button data-action="${runtime().active.paused?'resume':'pause'}">${runtime().active.paused?'Resume':'Pause'}</button><button data-action="cancel">Cancel</button>`:''}<button class="link small" data-view="laboratory">Open Laboratory ↗</button></div></div><div class="activity-lines">${r?r.events.slice(-4).reverse().map(e=>`<div class="activity-line"><span class="symbol">${e.state==='failed'?'!':e.type==='task.completed'?'✓':'↳'}</span><span>${esc(e.label)}</span><time>${time(e.at)}</time></div>`).join(''):'<div class="activity-line"><span class="symbol">✧</span>Your workshop is ready. Run a task to see what happens.</div>'}</div></section>`;}
  function blueprint(){const a=configDraft()||agent();return `<div class="intro-card">One agent, three perspectives. Changes here configure the agent in your Workshop. The diagram shows the current fixed simulation path; autonomous decisions and editable multi-agent graphs are future integrations.</div><div class="view-grid"><section class="panel"><div class="panel-head"><h2>Edit ${esc(agent().name)}</h2><span class="pill">Version ${agent().version}</span></div><form id="config-form" class="form-body"><div class="edit-notice">Editing this agent preserves its identity and history. Changes apply to future runs.</div>${identity.fields(a,esc)}<label class="field">Role<input name="role" type="text" maxlength="80" required value="${esc(a.role)}"></label><label class="field">Agent name<input type="text" name="name" value="${esc(a.name)}" required maxlength="32"></label><label class="field">Instructions<textarea name="instructions" rows="3" maxlength="2000" required>${esc(a.instructions)}</textarea><small>The simulator recognizes “bullets”, “risk” / “uncertainty”, “next steps”, and “detailed” cues. Other instructions are recorded for inspection, but require a future model to interpret freely.</small></label><button type="button" class="small risk-helper" data-action="add-risk">＋ Add risk review instruction</button><label class="field">Output style<select name="format" class="${highlight('format')}"><option value="concise" ${a.format==='concise'?'selected':''}>Concise · first 3 sentences</option><option value="detailed" ${a.format==='detailed'?'selected':''}>Detailed · first 7 sentences</option></select></label><label class="checkbox-row"><input type="checkbox" name="tool" ${a.tool?'checked':''}>Enable Sample document tool</label><label class="field"><small>Permission: read only the text below. No access to your files or accounts.</small></label><details><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Edit the sample document</summary><label class="field"><textarea name="document" rows="7" maxlength="10000" required>${esc(a.document)}</textarea><small>Use a title, a blank line, then the document body. This text is stored in this browser.</small></label></details><div class="section-space form-actions"><span class="form-dirty" id="dirty-label">${configDraft()?'Unsaved changes · draft kept on this device':'All changes saved'}</span><button class="primary${highlight('config-save')}" type="submit" ${busy()?'disabled':''}>Save Changes</button></div>${formError?`<p class="error-inline" role="alert">${esc(formError)}</p>`:''}</form></section><div><section class="panel"><div class="panel-head"><h2>Execution blueprint</h2><span class="eyebrow">Simulation path</span></div><div class="flow"><div class="node"><div class="eyebrow">01 · Input</div><h3>Your task</h3><p>A natural-language request from the chat.</p></div><div class="connector"></div><div class="node identity-accent"><div class="eyebrow">02 · Agent</div><h3>${agent().symbol} ${esc(agent().name)} · v${agent().version}</h3><p>Instructions + ${esc(agent().format)} output<br>Provider: deterministic simulation</p></div><div class="connector"></div><div class="node"><div class="eyebrow">03 · Tool</div><h3>sample_document.read</h3><p>${agent().tool?'Enabled · read-only local sample':'Disabled · runs will stop with an error'}</p></div><div class="connector"></div><div class="node"><div class="eyebrow">04 · Result</div><h3>Response + execution trace</h3><p>Inspect the output and score it in Laboratory.</p></div></div><div class="info-box">${state.settings.advanced?'The runtime publishes typed events to subscribers. Each run snapshots the agent configuration and uses a provider adapter. A real model adapter can later select tools dynamically; this simulator uses a fixed sequence.':'A chatbot responds to a message. An agent can also use tools to carry out a task. Here, you can see that loop in a predictable simulation. The simulated path is fixed, so it is also a workflow.'}</div   function trace(r){return r.events.map(e=>`<details class="trace-item${e.type==='tool.result'?highlight('tool-result'):''}" data-event-id="${e.id}" data-event-type="${e.type}" ${openEvents.has(e.id)?'open':''}><summary><span>${esc(e.label)}</span><time>${time(e.at)}</time></summary><pre>${esc(JSON.stringify(state.settings.advanced?{type:e.type,at:e.at,...e.data}:e.data,null,2))}</pre></details>`).join('');}
  function lab(){const r=currentRun();if(!r)return `<section class="panel empty"><h2>Your first experiment starts with a task.</h2><p>Run a task in Workshop, then come here to inspect the trace and evaluate the output.</p><button class="primary" data-view="workshop">Go to Workshop</button></section>${tutorial()}`;const out=r.events.find(e=>e.type==='task.completed')?.data.output;const complete=r.status==='completed';const evaluation=state.drafts.evaluations[r.id]||r.evaluation;return `<div class="metric-row"><div class="metric"><b class="${r.status==='failed'?'danger':''}" style="text-transform:capitalize">${r.status.replace('-',' ')}</b><span>Run status</span></div><div class="metric"><b>${r.events.length}</b><span>Observable events</span></div><div class="metric"><b>$0.00</b><span>Simulation · no model tokens</span></div></div><div class="view-grid"><section class="panel"><div class="panel-head"><h2>${agent().symbol} ${esc(agent().name)}’s execution trace</h2><select id="run-select" class="run-select" aria-label="Select a run">${runs().map((x,i)=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>Run ${runs().length-i} · v${x.config.version} · ${time(x.started)} · ${esc(x.status)}</option>`).join('')}</select></div><div class="info-box">${esc(r.task)}<br><small>Configuration snapshot: ${esc(r.config.name)} v${r.config.version} · ${esc(r.config.format)}</small></div><div class="trace-list">${trace(r)}</div>${['failed','cancelled'].includes(r.status)?'<div class="form-body"><p class="muted" style="font-size:12px;margin-bottom:13px">Check the error above. A disabled tool must be enabled in Blueprint. Intentional practice failures are cleared automatically.</p><button class="primary" data-action="retry" '+(busy()?'disabled':'')+'>Retry with current configuration</button></div>':''}</section><div><section class="panel"><div class="panel-head"><h2>Agent output</h2><span class="pill">Simulated</span></div><details class="output-details" id="output-details" ${openEvents.has('output-'+r.id)?'open':''}><summary>Inspect agent output ${out?'↗':'· waiting for completion'}</summary><div class="output">${out?esc(out):'No completed output yet. The trace shows the current state.'}</div></details></section><section class="panel section-space"><div class="panel-head"><h2>Human evaluation</h2><span class="eyebrow">${r.evaluation?'Saved':'Your judgment matters'}</span></div><form id="evaluation-form" class="form-body"><p class="muted" style="font-size:12px;margin-bottom:15px">Compare the output with the source in “Document received”. Score accuracy and whether it includes the important findings, limitations, and next steps.</p><div class="score-row"><label class="field">Accuracy<select name="accuracy" required ${!complete?'disabled':''}>${['Choose…','1 · Incorrect','2 · Major errors','3 · Some errors','4 · Mostly accurate','5 · Accurate'].map((v,i)=>`<option value="${i||''}" ${Number(evaluation?.accuracy)===i?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Coverage<select name="coverage" required ${!complete?'disabled':''}>${['Choose…','1 · Missing essentials','2 · Limited','3 · Partial','4 · Good','5 · Complete'].map((v,i)=>`<option value="${i||''}" ${Number(evaluation?.coverage)===i?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field">Review notes<textarea name="notes" rows="2" maxlength="2000" placeholder="What worked? What would you change?" ${!complete?'disabled':''}>${esc(evaluation?.notes||'')}</textarea></label><button type="submit" class="primary${highlight('score')}" ${!complete?'disabled':''}>Save evaluation</button></form></section></div></div><section class="panel section-space"><div class="panel-head"><div><h2>Compare experiments</h2><div class="sub">Completed runs for ${esc(agent().name)} · immutable configuration snapshots</div></div><button class="${highlight('compare')}" data-action="compare" ${runs().filter(r=>r.status==='completed').length<2?'disabled':''}>Compare latest two</button></div><div id="comparison"><div class="info-box">Run the same task with a different output style, then compare the two results here.</div></div></section>${tutorial()}`;}
  function learn(){return `${contextLesson()}<section class="panel form-body"><h2>Practice sandbox</h2><p>Practice agents are labeled in the roster. Reset removes only those fixtures and their records, never your personal agents.</p><button data-action="prepare-practice">Open practice agent</button> <button data-action="reset-experiment">Reset Experiment</button><details><summary>Revisit tutorial actions</summary>${steps.map((step,i)=>`<p><button data-lesson="${i}">${i+1}. ${step.title}</button> · ${state.tutorial.progress?.[i]||'unfinished'}</p>`).join('')}</details></section><div class="guide-controls"><button data-action="restart-tutorial">Replay introductory tutorial</button><button data-action="toggle-tutorials">${state.settings.tutorialDisabled?'Enable tutorials':'Disable all tutorials'}</button><button data-action="import">Import workshop backup</button></div><div class="lesson-list"><section class="panel lesson"><span class="number">01 / INTERACTIVE TUTORIAL</span><h2>Your first agent</h2><p>Build a document explorer, watch it use a tool, inspect its trace, and evaluate the result. Learn through real interface actions in a safe simulation.</p><button class="primary" data-action="${state.tutorial.step>=steps.length?'restart-tutorial':state.tutorial.step>0?'continue-tutorial':'start-tutorial'}">${state.tutorial.step>=steps.length?'Replay tutorial':state.tutorial.step>0?'Continue tutorial':'Start tutorial'} ↗</button></section><section class="panel lesson"><span class="number">02 / EXPERIMENT</span><h2>When a tool fails</h2><p>Turn on a practice failure in Blueprint, run a task, and inspect the error in Laboratory. Retry to recover. Failure is an observable state you can diagnose.</p><button data-action="failure-lesson">Try a practice failure</button></section><section class="panel lesson"><span class="number">CONCEPT / CONTEXT & MEMORY</span><h2>What does an agent remember?</h2><p>This prototype stores chat history in your browser, but each simulated run reads only its task, saved instructions, and sample document. Stored conversation is not automatically model context or long-term memory.</p></section><section class="panel lesson"><span class="number">CONCEPT / WORKFLOWS & AGENTS</span><h2>Who chooses the next step?</h2><p>A workflow follows predefined steps. A model-driven agent can choose actions based on observations. This prototype demonstrates the execution loop with fixed steps; model decisions require a future integration. Try the recorded Research → Evaluation handoff in Workshop.</p></section></div>${tutorial()}`;}
  function render(){
    const focused=document.activeElement;const focusId=focused?.id;const focusName=focused?.name;const focusForm=focused?.closest('form')?.id;const caret=typeof focused?.selectionStart==='number'?[focused.selectionStart,focused.selectionEnd]:null;

success-banner" role="status">✓ ${esc(state.ui.notice)} <button class="link small" data-action="dismiss-notice" aria-label="Dismiss confirmation">×</button></div>`:''}${({workshop,blueprint,laboratory:()=>sharedTimeline()+lab(),learn,roster,queue:queueView,sessions:sessionView,settings:settingsView})[view]()}<footer class="footer-note"><span>Made for curiosity. Room for every agent.</span><span>${storageOK?'● Saved in this browser':'Storage unavailable — keep this tab open and export your data'} · Neon review 0.2.0</span></footer></main></div>${modal?creationDialog():''}<input id="import-file" type="file" accept="application/json,.json" hidden>`;
    bind();applyHighlights();renderConnections();if(comparisonVisible&&view==='laboratory')showComparison();

  function go(next){view=next;state.ui.view=next;formError='';if(next==='laboratory'&&liveTutorial()&&state.tutorial.step===5&&state.selected===state.tutorial.agentId&&latest()?.events.length){selectedRun=state.tutorial.baseline;advance('observe','You opened this agent’s real execution events.');}save();render();window.scrollTo({top:0,behavior:'instant'});}

  function beginTask(task){if(agent().lifecycle!=='active'){toast('Return this agent to the Workshop from the roster first.');return;}task=task.trim();if(!task){const err=document.getElementById('task-error');if(err)err.textContent='Add a task first, or choose one of the examples.';return;}
    if(liveTutorial()&&state.tutorial.step===9&&agent().id===state.tutorial.agentId){const base=state.runs.find(r=>r.id===state.tutorial.baseline);if(base&&task!==base.task){toast('This task will run normally. The tutorial comparison still needs the original task.');}}

      if(action==='open'&&s){a.sessionId=s.id;save();go('workshop');return;}
      if(action==='reuse'&&s?.summary&&!current.context.some(c=>c.sourceId===s.id))current.context.push({sourceId:s.id,text:s.summary,kind:'session-summary'});
      if(action==='use-memory'&&m&&!current.context.some(c=>c.sourceId===m.id))current.context.push({sourceId:m.id,text:m.text,kind:'memory'});
      if(action==='delete-memory'&&m){state.memories=state.memories.filter(x=>x.id!==m.id);for(const s of state.sessions)s.context=s.context.filter(c=>c.sourceId!==m.id);toast('Memory and selected copies removed. Past run snapshots and exported backups remain unchanged.');}
      if(action==='remove-context')current.context.splice(Number(el.dataset.index),1);save();render();
    });
    document.querySelectorAll('[data-summary]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const s=state.sessions.find(s=>s.id===form.dataset.summary);s.summary=String(new FormData(form).get('summary')).trim();save();render();});
    document.querySelectorAll('[data-memory]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const m=state.memories.find(m=>m.id===form.dataset.memory);m.text=String(new FormData(form).get('text')).trim();save();render();});
    document.getElementById('memory-form')?.addEventListener('submit',e=>{e.preventDefault();const text=String(new FormData(e.target).get('memory')).trim();if(!text)return;state.memories.push({id:uid(),agentId:agent().id,text,created:data.now()});save();render();});
  }

  save();render();
})();

</script></body>
</html>
