<body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
/* Runtime boundary: future providers implement plan(config, task) and return observable steps.
   The UI subscribes to events; it never invents progress or exposes model reasoning. */
(function (root) {
  const SAMPLE = 'Greenhouse sensor trial — QA field notes\n\nThe team tested 24 temperature sensors over seven days. Twenty-two sensors met the acceptance limit of ±0.5°C. Two sensors drifted beyond the limit after exposure to high humidity. Both failures came from batch B. The reference thermometer was calibrated before the trial. Humidity was not controlled, so the cause of the drift has not been confirmed. Quarantine batch B and repeat testing under controlled humidity before release. The trial lead will review the repeat results on Friday.';
  const split = text => { const parts=text.split(/\n\s*\n/);const body=parts.length>1?parts.slice(1).join(' '):text;return body.split(/(?<=[.!?])\s+(?=[A-Z])/).map(x=>x.trim()).filter(Boolean); };
  class SimulationProvider {
    plan(config, task, fail) {
      const base = [{type:'task.started',state:'working',label:'Task received',data:{task,agent:config.name,version:config.version,provider:'Deterministic simulation'}}];
      if (!config.tool) return [...base,{type:'task.failed',state:'failed',label:'Document tool is disabled',data:{error:'Enable the Sample document tool in Blueprint, save, and retry. No document was read.'}}];
      const steps = [...base,{type:'tool.called',state:'using-tool',label:'Reading sample document',data:{tool:'sample_document.read',input:{document:'workshop-sample'},permission:'Local sample only'}}];
      if(fail) return [...steps,{type:'tool.failed',state:'failed',label:'Simulated document read failure',data:{error:'Intentional practice failure. Retry to run again; no external service was contacted.'}}];
      const text=config.document || SAMPLE;
      steps.push({type:'tool.result',state:'working',label:'Document received',data:{tool:'sample_document.read',output:text,characters:text.length}});
      const sentences=split(text); const detailed=config.format==='detailed'||/detailed/i.test(config.instructions);
      let chosen=sentences.slice(0,detailed?7:3);
      if(/risk|uncertain|limitation/i.test(config.instructions)) {
        const risk=sentences.find(s=>/not confirmed|not been confirmed|uncertain|not controlled|limitation|risk/i.test(s));
        if(risk&&!chosen.includes(risk)) chosen.push(risk);
      }
      if(/next steps?/i.test(config.instructions)) {
        const next=sentences.find(s=>/quarantine|repeat|must|should|next/i.test(s));
        if(next&&!chosen.includes(next))chosen.push(next);
      }
      let output;
      if(/checklist|action|next step/i.test(task)) output='Action checklist (simulated)\n\n'+sentences.filter(s=>/quarantine|repeat|review|must|should|next/i.test(s)).map(s=>'☐ '+s).join('\n');
      else if(/summari|summary|explain|document|sensor|report|trial/i.test(task)) output=(detailed?'Detailed summary':'Concise summary')+' (simulated)\n\n'+chosen.map(s=>(/bullet/i.test(config.instructions)||detailed?'• ':'')+s).join(detailed?'\n':' ')+'\n\nSource: the sample document. This is a rule-based extract, not a model-generated answer.';
      else output='This simulation can summarize the sample document or extract an action checklist. Try “Summarize the sample document” or “Create an action checklist.” Open Blueprint to change the document, output style, and supported instruction cues (bullets and risks). General conversation requires a future model integration.';
      steps.push({type:'output.created',state:'working',label:'Preparing response',data:{method:'Deterministic sentence extraction',format:config.format,instructions:config.instructions}});
      steps.push({type:'task.completed',state:'completed',label:'Task completed',data:{output,cost:0,modelTokens:null}});
      return steps;
    }
  }
  class AgentRuntime {
    constructor(provider=new SimulationProvider(),delay=750){this.provider=provider;this.delay=delay;this.listeners=new Set();this.active=null;}
    subscribe(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn);}
    emit(step){const event={...step,id:crypto.randomUUID(),runId:this.active.id,at:new Date().toISOString()};this.listeners.forEach(fn=>fn(event));}
    start(id,config,task,fail=false){if(this.active) throw Error('A run is already active');this.active={id,steps:this.provider.plan(config,task,fail),index:0,paused:false};this.tick();}
    tick(){if(!this.active||this.active.paused)return;const a=this.active;const step=a.steps[a.index++];if(!step)return;this.emit(step);if(['completed','failed'].includes(step.state)){this.active=null;return;}this.timer=setTimeout(()=>this.tick(),this.delay);}
    pause(){if(!this.active||this.active.paused)return;clearTimeout(this.timer);this.active.paused=true;this.emit({type:'task.paused',state:'paused',label:'Paused by you',data:{message:'The simulation will wait until you resume.'}});}
    resume(){if(!this.active?.paused)return;this.active.paused=false;this.emit({type:'task.resumed',state:'working',label:'Resumed by you',data:{}});this.timer=setTimeout(()=>this.tick(),this.delay);}
    cancel(){if(!this.active)return;clearTimeout(this.timer);this.emit({type:'task.cancelled',state:'cancelled',label:'Cancelled by you',data:{}});this.active=null;}
  }
  root.WorkshopCore={SAMPLE,SimulationProvider,AgentRuntime};
})(typeof window!=='undefined'?window:globalThis);

</script><script>
/* Persistent visual identity. Shared by the room, editor, conversation and traces. */
window.WorkshopIdentity = (() => {
  const palette = [
    {name:'Poppy red',value:'#c94e63'}, {name:'Marigold orange',value:'#de8735'},
    {name:'Sunflower yellow',value:'#d4ac30'}, {name:'Moss green',value:'#569773'},
    {name:'Sky blue',value:'#4e94c5'}, {name:'Twilight indigo',value:'#6c6bb5'},
    {name:'Orchid violet',value:'#a96bb4'}
  ];
  const shapes=[{id:'round',name:'Round companion'},{id:'square',name:'Boxy explorer'},{id:'cat',name:'Cat-eared scout'}];
  const accessories=[{id:'sprout',name:'Sprout'},{id:'antenna',name:'Antenna'},{id:'star',name:'Star'},{id:'none',name:'No accessory'}];
  const symbols=['✿','◆','★','☀','☾','✦','♥'];
  const validColor=value=>/^#[0-9a-f]{6}$/i.test(value||'');
  function ink(color){const hex=validColor(color)?color:'#569773';const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2]>.179?'#000000':'#ffffff';}
  function defaults(name,index=0){index=Math.max(0,index);const moss=/^moss$/i.test(name),herman=/^herman$/i.test(name);return {color:moss?palette[3].value:herman?palette[1].value:palette[[3,1,4,6,0,2,5][index%7]].value,avatar:moss?'round':herman?'square':shapes[index%3].id,accessory:moss?'sprout':herman?'antenna':accessories[index%4].id,symbol:moss?'✿':herman?'◆':symbols[index%7],provider:'simulation',model:'extractive-v1',memory:'history-only'};}

  function creationDialog(){const c=state.ui.creation;if(!c)return '';const a=c.agent;const phase=c.phase||0;return `<div class="dialog-backdrop"><section class="dialog create-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-heading"><div><div class="eyebrow">New identity · existing agents stay unchanged</div><h2 id="dialog-title">Create New Agent</h2></div><button class="link" data-action="close-modal" aria-label="Close and keep draft">×</button></div><div class="creation-progress"><span class="${phase===0?'current':''}">1 · Identity</span><span class="${phase===1?'current':''}">2 · Instructions & tools</span><span class="${phase===2?'current':''}">3 · Review & create</span></div>${liveTutorial()?`<div class="dialog-guidance"><strong>Lesson ${steps[state.tutorial.step]?.lesson||2}: ${steps[state.tutorial.step]?.title||'Create your agent'}</strong><p>${steps[state.tutorial.step]?.text||''}</p></div>`:''}${liveTutorial()?'<div class="guide-controls"><button data-action="skip-step">Skip Step →</button><button data-action="tutorial-help">I’m stuck</button><button data-action="skip-tutorial">Exit tutorial</button></div>':''}<form id="create-form">${phase===0?`<label class="field">Agent name<input id="new-agent-name" name="name" type="text" maxlength="32" required placeholder="e.g. Herman" autocomplete="off" value="${esc(a.name)}"></label>${identity.fields(a,esc)}`:phase===1?`<div class="draft-identity" style="${style(a)}">${bot(a)}<div><strong>${esc(a.name)}</strong><p>New agent draft · not created yet</p></div></div><label class="field">Role<input name="role" type="text" maxlength="80" required value="${esc(a.role)}"></label><label class="field">Instructions<textarea name="instructions" rows="3" maxlength="2000" required>${esc(a.instructions)}</textarea><small>Try “Use bullets.” and “Include risks and uncertainty.” These are supported simulation cues.</small></label><label class="checkbox-row"><input type="checkbox" name="tool" ${a.tool?'checked':''}>Enable Sample document tool</label><p class="field-help">Read-only access to this agent’s sample text. No access to your files or accounts.</p><details class="advanced-settings"><summary>Advanced settings · provider, model & memory</summary>${advancedSettings(a)}</details>`:`<div class="review-agent" style="${style(a)}">${bot(a)}<h3>${a.symbol} ${esc(a.name)}</h3><p>${esc(a.role)}</p></div><dl class="review-list"><dt>Appearance</dt><dd>${esc(identity.shapes.find(x=>x.id===a.avatar).name)} · ${esc(identity.accessories.find(x=>x.id===a.accessory).name)}</dd><dt>Instructions</dt><dd>${esc(a.instructions)}</dd><dt>Tool access</dt><dd>${a.tool?'Sample document · read only':'No tools enabled'}</dd><dt>Execution</dt><dd>Simulation · no API costs</dd></dl><p class="field-help">Create Agent adds a new workstation and saves this agent independently. It does not rename or replace Moss or anyone else.</p>`}<p id="create-error" class="error-inline" role="alert"></p><div class="form-actions"><button type="button" data-action="${phase?'create-back':'close-modal'}">${phase?'Back':'Close · keep draft'}</button><button class="primary" type="submit" id="create-next">${['Continue to instructions →','Review agent →','Create Agent'][phase]}</button></div></form></section></div>`;}

  function workshop(){const a=agent(),r=latest();const msgs=state.messages.filter(m=>m.agentId===a.id);return `<div class="workspace-grid"><div><section class="panel"><div class="panel-head"><h2>Your workshop <span class="muted" style="font-size:11px;font-weight:400;margin-left:8px">${state.agents.length} independent ${state.agents.length===1?'agent':'agents'}</span></h2><select class="agent-switch" id="agent-select" aria-label="Active agent">${state.agents.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${room()}<div class="scene-footer"><span><span class="live-dot"></span>Simulation environment</span><label class="zoom-control">Room scale <select id="room-zoom" aria-label="Room scale"><option value="1" ${state.ui.zoom===1?'selected':''}>100%</option><option value="0.85" ${state.ui.zoom===.85?'selected':''}>85%</option><option value="0.7" ${state.ui.zoom===.7?'selected':''}>70%</option></select></label></div><div class="agent-row"><div class="agent-mini">${bot()}</div><div class="agent-info"><h3>${a.symbol} ${esc(a.name)} <small>· Selected agent</small></h3><p>${esc(a.role)} · configuration v${a.version}</p></div><span class="status-tag ${status()}">${status().replace('-',' ')}</span><button class="small" data-view="blueprint">Edit agent</button></div></section><div class="under-workshop"><div class="stat-card"><div class="eyebrow">Learning through doing</div><div class="value">${runs().filter(r=>r.status==='completed').length} <span style="font-size:12px;color:var(--muted)">completed runs</span></div><p>Every run has a trace you can inspect.</p></div><div class="stat-card"><div class="eyebrow">A safe place to experiment</div><div class="value">$0.00 <span style="font-size:12px;color:var(--muted)">API spend</span></div><p>Simulated responses. No API connection.</p></div></div></div><section class="panel chat identity-accent"><div class="panel-head"><div><h2>${a.symbol} Chat with ${esc(a.name)}</h2><div class="sub"><span class="live-dot"></span>${busy()?'Run in progress':'Ready to explore'}</div></div><span class="pill">Simulation</span></div><div class="chat-messages" id="messages" role="log" aria-label="Agent conversation">${msgs.length?msgs.map(m=>`<div class="chat-message ${m.role}"><div class="who">${m.role==='user'?'You':esc(a.name)}${m.role==='agent'?'<span class="sim-label">SIMULATED</span>':''}<span class="time">${time(m.at)}</span></div><div class="message">${esc(m.text)}</div></div>`).join(''):`<div class="empty-chat">${bot()}<h3>Hello, I’m ${esc(a.name)}.</h3><p>Let’s turn a document into something useful. Give me a task and watch how the pieces work together.</p><p>This sandbox uses scripted responses.<br>No model or account is connected.</p></div>`}</div><form id="task-form" class="composer"><div class="prompt-chips"><button type="button" data-prompt="Summarize the sample document">Summarize document</button><button type="button" data-prompt="Create an action checklist from the sample document">Make a checklist</button></div><div class="input-wrap"><textarea id="task-input" aria-label="Task for your agent" placeholder="What would you like to explore?" maxlength="2000" ${busy()?'disabled':''}>${esc(chatDraft())}</textarea><div class="send-row"><span>Enter to send · Shift + Enter for a new line</span><button type="submit" class="primary${highlight('send')}" ${busy()?'disabled':''}>Run task ↑</button></div></div><div class="error-inline" id="task-error" role="alert"></div></form></section></div>${tutorial()}<section class="panel activity-panel"><div class="panel-head"><h2>${a.symbol} ${esc(a.name)}’s activity</h2><div class="run-controls">${busy()?`<button data-action="${runtime().active.paused?'resume':'pause'}">${runtime().active.paused?'Resume':'Pause'}</button><button data-action="cancel">Cancel</button>`:''}<button class="link small" data-view="laboratory">Open Laboratory ↗</button></div></div><div class="activity-lines">${r?r.events.slice(-4).rever   function blueprint(){const a=configDraft()||agent();return `<div class="intro-card">One agent, three perspectives. Changes here configure the agent in your Workshop. The diagram shows the current fixed simulation path; autonomous decisions and editable multi-agent graphs are future integrations.</div><div class="view-grid"><section class="panel"><div class="panel-head"><h2>Edit ${esc(agent().name)}</h2><span class="pill">Version ${agent().version}</span></div><form id="config-form" class="form-body"><div class="edit-notice">Editing this agent preserves its identity and history. Changes apply to future runs.</div>${identity.fields(a,esc)}<label class="field">Role<input name="role" type="text" maxlength="80" required value="${esc(a.role)}"></label><label class="field">Agent name<input type="text" name="name" value="${esc(a.name)}" required maxlength="32"></label><label class="field">Instructions<textarea name="instructions" rows="3" maxlength="2000" required>${esc(a.instructions)}</textarea><small>The simulator recognizes “bullets”, “risk” / “uncertainty”, “next steps”, and “detailed” cues. Other instructions are recorded for inspection, but require a future model to interpret freely.</small></label><button type="button" class="small risk-helper" data-action="add-risk">＋ Add risk review instruction</button><label class="field">Output style<select name="format" class="${highlight('format')}"><option value="concise" ${a.format==='concise'?'selected':''}>Concise · first 3 sentences</option><option value="detailed" ${a.format==='detailed'?'selected':''}>Detailed · first 7 sentences</option></select></label><label class="checkbox-row"><input type="checkbox" name="tool" ${a.tool?'checked':''}>Enable Sample document tool</label><label class="field"><small>Permission: read only the text below. No access to your files or accounts.</small></label><details><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Edit the sample document</summary><label class="field"><textarea name="document" rows="7" maxlength="10000" required>${esc(a.document)}</textarea><small>Use a title, a blank line, then the document body. This text is stored in this browser.</small></label></details><div class="section-space form-actions"><span class="form-dirty" id="dirty-label">${configDraft()?'Unsaved changes · draft kept on this device':'All changes saved'}</span><button class="primary${highlight('config-save')}" type="submit" ${busy()?'disabled':''}>Save Changes</button></div>${formError?`<p class="error-inline" role="alert">${esc(formError)}</p>`:''}</form></section><div><section class="panel"><div class="panel-head"><h2>Execution blueprint</h2><span class="eyebrow">Simulation path</span></div><div class="flow"><div class="node"><div class="eyebrow">01 · Input</div><h3>Your task</h3><p>A natural-language request from the chat.</p></div><div class="connector"></div><div class="node identity-accent"><div class="eyebrow">02 · Agent</div><h3>${agent().symbol} ${esc(agent().name)} · v${agent().version}</h3><p>Instructions + ${esc(agent().format)} output<br>Provider: deterministic simulation</p></div><div class="connector"></div><div class="node"><div class="eyebrow">03 · Tool</div><h3>sample_document.read</h3><p>${agent().tool?'Enabled · read-only local sample':'Disabled · runs will stop with an error'}</p></div><div class="connector"></div><div class="node"><div class="eyebrow">04 · Result</div><h3>Response + execution trace</h3><p>Inspect the output and score it in Laboratory.</p></div></div><div class="info-box">${state.settings.advanced?'The runtime publishes typed events to subscribers. Each run snapshots the agent configuration and uses a provider adapter. A real model adapter can later select tools dynamically; this simulator uses a fixed sequence.':'A chatbot responds to a message. An agent can also use tools to carry out a task. Here, you can see that loop in a predictable simulation. The simulated path is fixed, so it is also a workflow.'}</div   function trace(r){return r.events.map(e=>`<details class="trace-item${e.type==='tool.result'?highlight('tool-result'):''}" data-event-id="${e.id}" data-event-type="${e.type}" ${openEvents.has(e.id)?'open':''}><summary><span>${esc(e.label)}</span><time>${time(e.at)}</time></summary><pre>${esc(JSON.stringify(state.settings.advanced?{type:e.type,at:e.at,...e.data}:e.data,null,2))}</pre></details>`).join('');}
  function lab(){const r=currentRun();if(!r)return `<section class="panel empty"><h2>Your first experiment starts with a task.</h2><p>Run a task in Workshop, then come here to inspect the trace and evaluate the output.</p><button class="primary" data-view="workshop">Go to Workshop</button></section>${tutorial()}`;const out=r.events.find(e=>e.type==='task.completed')?.data.output;const complete=r.status==='completed';const evaluation=state.drafts.evaluations[r.id]||r.evaluation;return `<div class="metric-row"><div class="metric"><b class="${r.status==='failed'?'danger':''}" style="text-transform:capitalize">${r.status.replace('-',' ')}</b><span>Run status</span></div><div class="metric"><b>${r.events.length}</b><span>Observable events</span></div><div class="metric"><b>$0.00</b><span>Simulation · no model tokens</span></div></div><div class="view-grid"><section class="panel"><div class="panel-head"><h2>${agent().symbol} ${esc(agent().name)}’s execution trace</h2><select id="run-select" class="run-select" aria-label="Select a run">${runs().map((x,i)=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>Run ${runs().length-i} · v${x.config.version} · ${time(x.started)} · ${esc(x.status)}</option>`).join('')}</select></div><div class="info-box">${esc(r.task)}<br><small>Configuration snapshot: ${esc(r.config.name)} v${r.config.version} · ${esc(r.config.format)}</small></div><div class="trace-list">${trace(r)}</div>${['failed','cancelled'].includes(r.status)?'<div class="form-body"><p class="muted" style="font-size:12px;margin-bottom:13px">Check the error above. A disabled tool must be enabled in Blueprint. Intentional practice failures are cleared automatically.</p><button class="primary" data-action="retry" '+(busy()?'disabled':'')+'>Retry with current configuration</button></div>':''}</section><div><section class="panel"><div class="panel-head"><h2>Agent output</h2><span class="pill">Simulated</span></div><details class="output-details" id="output-details" ${openEvents.has('output-'+r.id)?'open':''}><summary>Inspect agent output ${out?'↗':'· waiting for completion'}</summary><div class="output">${out?esc(out):'No completed output yet. The trace shows the current state.'}</div></details></section><section class="panel section-space"><div class="panel-head"><h2>Human evaluation</h2><span class="eyebrow">${r.evaluation?'Saved':'Your judgment matters'}</span></div><form id="evaluation-form" class="form-body"><p class="muted" style="font-size:12px;margin-bottom:15px">Compare the output with the source in “Document received”. Score accuracy and whether it includes the important findings, limitations, and next steps.</p><div class="score-row"><label class="field">Accuracy<select name="accuracy" required ${!complete?'disabled':''}>${['Choose…','1 · Incorrect','2 · Major errors','3 · Some errors','4 · Mostly accurate','5 · Accurate'].map((v,i)=>`<option value="${i||''}" ${Number(evaluation?.accuracy)===i?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Coverage<select name="coverage" required ${!complete?'disabled':''}>${['Choose…','1 · Missing essentials','2 · Limited','3 · Partial','4 · Good','5 · Complete'].map((v,i)=>`<option value="${i||''}" ${Number(evaluation?.coverage)===i?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field">Review notes<textarea name="notes" rows="2" maxlength="2000" placeholder="What worked? What would you change?" ${!complete?'disabled':''}>${esc(evaluation?.notes||'')}</textarea></label><button type="submit" class="primary${highlight('score')}" ${!complete?'disabled':''}>Save evaluation</button></form></section></div></div><section class="panel section-space"><div class="panel-head"><div><h2>Compare experiments</h2><div class="sub">Completed runs for ${esc(agent().name)} · immutable configuration snapshots</div></div><button class="${highlight('compare')}" data-action="compare" ${runs().filter(r=>r.status==='completed').length<2?'disabled':''}>Compare latest two</button></div><div id="comparison"><div class="info-box">Run the same task with a different output style, then compare the two results here.</div></div></section>${tutorial()}`;}
  function learn(){return `<section class="panel form-body"><h2>Practice sandbox</h2><p>Practice agents are labeled in the roster. Reset removes only those fixtures and their records, never your personal agents.</p><button data-action="prepare-practice">Open practice agent</button> <button data-action="reset-experiment">Reset Experiment</button><details><summary>Revisit tutorial actions</summary>${steps.map((step,i)=>`<p><button data-lesson="${i}">${i+1}. ${step.title}</button> · ${state.tutorial.progress?.[i]||'unfinished'}</p>`).join('')}</details></section><div class="guide-controls"><button data-action="restart-tutorial">Replay introductory tutorial</button><button data-action="toggle-tutorials">${state.settings.tutorialDisabled?'Enable tutorials':'Disable all tutorials'}</button><button data-action="import">Import workshop backup</button></div><div class="lesson-list"><section class="panel lesson"><span class="number">01 / INTERACTIVE TUTORIAL</span><h2>Your first agent</h2><p>Build a document explorer, watch it use a tool, inspect its trace, and evaluate the result. Learn through real interface actions in a safe simulation.</p><button class="primary" data-action="${state.tutorial.step>=steps.length?'restart-tutorial':state.tutorial.step>0?'continue-tutorial':'start-tutorial'}">${state.tutorial.step>=steps.length?'Replay tutorial':state.tutorial.step>0?'Continue tutorial':'Start tutorial'} ↗</button></section><section class="panel lesson"><span class="number">02 / EXPERIMENT</span><h2>When a tool fails</h2><p>Turn on a practice failure in Blueprint, run a task, and inspect the error in Laboratory. Retry to recover. Failure is an observable state you can diagnose.</p><button data-action="failure-lesson">Try a practice failure</button></section><section class="panel lesson"><span class="number">CONCEPT / CONTEXT & MEMORY</span><h2>What does an agent remember?</h2><p>This prototype stores chat history in your browser, but each simulated run reads only its task, saved instructions, and sample document. Stored conversation is not automatically model context or long-term memory.</p></section><section class="panel lesson"><span class="number">CONCEPT / WORKFLOWS & AGENTS</span><h2>Who chooses the next step?</h2><p>A workflow follows predefined steps. A model-driven agent can choose actions based on observations. This prototype demonstrates the execution loop with fixed steps; model decisions and agent handoffs are future extensions.</p></section></div>${tutorial()}`;}
  function render(){
    const focused=document.activeElement;const focusId=focused?.id;const focusName=focused?.name;const focusForm=focused?.closest('form')?.id;const caret=typeof focused?.selectionStart==='number'?[focused.selectionStart,focused.selectionEnd]:null;
    const roomScroll=document.querySelector('.room-scroll');const scroll=roomScroll?[roomScroll.scrollLeft,roomScroll.scrollTop]:null;
    const labels={workshop:['The Workshop','A colorful little headquarters for independent minds.'],blueprint:[`Edit ${agent().name}`,'Your selected agent’s identity, instructions, and tools.'],laboratory:['The Laboratory','Observe what happened. Understand what to improve.'],learn:['Field guide','Small experiments. Practical understanding.']};const l=labels[view];
    document.getElementById('app').innerHTML=`<div class="shell" style="${style()}"><aside class="sidebar"><div class="brand"><span class="brand-icon">❋</span><span class="brand-text">AI Agent<br>Workshop</span></div><div class="rainbow-stripe" aria-hidden="true"></div><div class="sidebar-label">YOUR CREATIVE SPACE</div><nav class="nav" aria-label="Main navigation">${Object.keys(labels).map(v=>`<button data-view="${v}" title="${v==='blueprint'?'Blueprint':labels[v][0]}" class="${v===view?'active':''}" ${v===view?'aria-current="page"':''}>${icon(v)}<span class="nav-text">${v==='learn'?'Field guide':v==='blueprint'?'Blueprint':labels[v][0].replace('The ','')}</span></button>`).join('')}</nav><div class="side-bottom"><div class="sandbox-card"><span class="live-dot"></span><span style="font-size:12px">Simulation mode</span><p>A safe place to learn.<br>No API keys. No costs.</p></div><button class="link small" data-action="export">↓ Export workshop</button><button class="link small" data-action="import">↑ Import backup</button><div class="profile"><span class="initial">✦</span><div>Your workspace<br><small>${state.agents.length} independent agents</small></div></div></div></aside><main class="main"><header class="topbar"><span>Workspace <span style="margin:0 9px">/</span> ${esc(l[0].replace('The ',''))}</span><div class="right"><span class="pill"><span class="live-dot"></span>Simulation mode</span><button class="link small" data-action="explanation">${state.settings.advanced?'Advanced explanations':'Beginner explanations'} ⌄</button><button class="link small" data-view="learn" aria-label="Open field guide">ⓘ</button></div></header><div class="page-heading"><div><h1>${esc(l[0])}</h1><p>${l[1]}</p></div>${view==='workshop'?'<button class="primary" data-action="new-agent">＋ New agent</button>':view!=='learn'?`<span class="selected-identity" style="${style()}">${agent().symbol} ${esc(agent().name)}</span>`:''}</div>${state.ui.notice?`<div class="success-banner" role="status">✓ ${esc(state.ui.notice)} <button class="link small" data-action="dismiss-notice" aria-label="Dismiss confirmation">×</button></div>`:''}${({workshop,blueprint,laboratory:lab,learn})[view]()}<footer class="footer-note"><span>Made for curiosity. Room for every agent.</span><span>${storageOK?'● Saved in this browser':'Storage unavailable — keep this tab open and export your data'} · Prototype 0.2</span></footer></main></div>${modal?creationDialog():''}<input id="import-file" type="file" accept="application/json,.json" hidden>`;
    bind();applyHighlights();if(comparisonVisible&&view==='laboratory')showComparison();
    const messages=document.getElementById('messages');if(messages)messages.scrollTop=messages.scrollHeight;
    if(scroll&&document.querySelector('.room-scroll')){document.querySelector('.room-scroll').scrollLeft=scroll[0];document.querySelector('.room-scroll').scrollTop=scroll[1];}
    const target=focusId?document.getElementById(focusId):focusName&&focusForm?document.querySelector(`#${focusForm} [name="${focusName}"]`):null;
    if(target){target.focus({preventScroll:true});if(caret&&target.setSelectionRange&&['text','textarea'].includes(target.type))target.setSelectionRange(...caret);}

  function go(next){view=next;state.ui.view=next;formError='';if(next==='laboratory'&&liveTutorial()&&state.tutorial.step===5&&state.selected===state.tutorial.agentId&&latest()?.events.length){selectedRun=state.tutorial.baseline;advance('observe','You opened this agent’s real execution events.');}save();render();window.scrollTo({top:0,behavior:'instant'});}
  function selectAgent(id){if(!state.agents.some(a=>a.id===id))return;state.selected=id;selectedRun=null;comparisonVisible=false;if(liveTutorial()&&state.tutorial.step===0&&id===state.tutorial.starterId)advance('meet','Moss is selected. Creating another agent will leave Moss unchanged.');save();render();document.getElementById('task-input')?.focus({preventScroll:true});}
  function beginTask(task){if(busy())return;task=task.trim();if(!task){const err=document.getElementById('task-error');if(err)err.textContent='Add a task first, or choose one of the examples.';return;}
    if(liveTutorial()&&state.tutorial.step===9&&agent().id===state.tutorial.agentId){const base=state.runs.find(r=>r.id===state.tutorial.baseline);if(base&&task!==base.task){toast('Use the same task as the first run for a controlled comparison.');return;}}
    const a=agent();const run={id:uid(),agentId:a.id,task,config:structuredClone(a),status:'queued',started:new Date().toISOString(),events:[],evaluation:null};state.runs.unshift(run);
    const agentRuns=runs(a.id);if(agentRuns.length>80){const old=new Set(agentRuns.slice(80).map(r=>r.id));state.runs=state.runs.filter(r=>!old.has(r.id));}
    state.messages.push({id:uid(),agentId:a.id,role:'user',text:task,at:run.started});state.drafts.chats[a.id]='';selectedRun=run.id;comparisonVisible=false;view='workshop';state.ui.view=view;
    if(liveTutorial()&&state.tutorial.agentId===a.id){if(state.tutorial.step===4){state.tutorial.baseline=run.id;advance('assign',`${a.name} received a task. Moss and the others keep their own states.`);}else if(state.tutorial.step===9){state.tutorial.revisedRun=run.id;advance('rerun','The same task is running with your revised instructions.');}}
    const fail=failureNext.has(a.id);failureNext.delete(a.id);save();runtime().start(run.id,run.config,task,fail);render();
  }
  function onRuntimeEvent(event){const r=state.runs.find(r=>r.id===event.runId);if(!r)return;r.events.push({...event,agentId:r.agentId});r.status=event.state;
    if(['completed','failed','cancelled'].includes(event.state)){r.finished=event.at;state.messages.push({id:uid(),agentId:r.agentId,role:'agent',text:event.type==='task.completed'?event.data.output:event.data.error||event.data.message||'Task cancelled. You can start a fresh run.',at:event.at});
      if(liveTutorial()&&r.agentId===state.tutorial.agentId&&event.type==='task.completed'&&state.tutorial.step===10&&state.selected===r.agentId){view='laboratory';state.ui.view=view;selectedRun=r.id;}
    }
    save();setTimeout(render,0);
  }

  function comparisonRuns(){const completed=runs().filter(r=>r.status==='completed');return completed.slice(0,2).reverse();}
  function showComparison(){const two=comparisonRuns();const el=document.getElementById('comparison');if(!el||two.length<2)return;el.innerHTML=`<div class="compare-grid" style="padding:18px">${two.map((r,i)=>`<div class="panel" style="${style(r.config)}"><div class="panel-head"><h2>${i?'After':'Before'} · v${r.config.version}</h2><span class="pill">${esc(r.config.format)}</span></div><div class="info-box"><strong>Saved instructions</strong><br>${esc(r.config.instructions)}</div><div class="output">${esc(r.events.find(e=>e.type==='task.completed').data.output)}</div><div class="info-box">${r.evaluation?`Human score: accuracy ${r.evaluation.accuracy}/5 · coverage ${r.evaluation.coverage}/5`:'Not scored yet'}</div></div>`).join('')}</div>`;}
  function compare(){const two=comparisonRuns();if(two.length<2)return;const t=state.tutorial;if(liveTutorial()&&t.step===10&&agent().id===t.agentId){if(two[1].id===t.revisedRun&&two[0].id===t.baseline&&two[1].task===two[0].task)advance('compare','Tutorial complete. You created, observed, evaluated, and improved your own agent.');else toast('Compare the original tutorial task with its revised run.');}comparisonVisible=true;render();document.getElementById('comparison')?.scrollIntoView({behavior:'smooth',block:'center'});}
  function readForm(form,base){const f=new FormData(form);const next={...base};for(const key of ['name','role','instructions','format','document','avatar','accessory','color','symbol'])if(f.has(key))next[key]=String(f.get(key));if(form.querySelector('[name="tool"]'))next.tool=f.get('tool')==='on';return identity.normalize(next);}
  function rememberForm(form){if(form.id==='create-form'){const c=state.ui.creation;c.agent=readForm(form,c.agent);}else state.drafts.agents[agent().id]=readForm(form,configDraft()||agent());save();const label=document.getElementById('dirty-label');if(label)label.textContent='Unsaved changes · draft kept on this device';updateAppearance(form);applyHighlights();}
  function updateAppearance(form){const a=form.id==='create-form'?state.ui.creation.agent:configDraft()||agent();const preview=form.querySelector('.avatar-preview');if(preview){preview.style.cssText=style(a);preview.innerHTML=bot(a)+'<span>Appearance preview</span>';}form.querySelectorAll('[data-color]').forEach(b=>{const chosen=b.dataset.color.toLowerCase()===a.color.toLowerCase();b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',chosen);b.textContent=chosen?'✓':'';});}
  function startTutorial(){state.settings.tutorialDisabled=false;let starter=state.agents.find(a=>a.practice&&a.name==='Practice Moss');if(!starter){starter=makeAgent('Practice Moss');starter.practice=true;state.agents.push(starter);}state.tutorial={schema:2,active:true,paused:false,step:0,progress:{},starterId:starter.id};state.selected=starter.id;modal=false;if(state.ui.creation)state.ui.creation.phase=0;save();go('workshop');}
  function guide(){const t=state.tutorial;const step=steps[t.step];if(!step)return;state.settings.tutorialDisabled=false;t.active=true;t.paused=false;if(t.step===0&&state.agents.some(a=>a.id===t.starterId))state.selected=t.starterId;else if(state.agents.some(a=>a.id===t.agentId))state.selected=t.agentId;t.help=true;modal=!!state.ui.creation&&t.step>=1&&t.step<=3;go(step.view);const el=document.querySelector('.highlight');el?.scrollIntoView({behavior:'smooth',block:'center'});}
  function applyHighlights(){document.querySelectorAll('.highlight').forEach(el=>el.classList.remove('highlight'));if(!liveTutorial())return;const t=state.tutorial;let target='';const c=state.ui.creation;
    if(t.step===0)target=`[data-select-agent="${t.starterId}"]`;
    if(t.step===1){if(!modal)target='[data-action="new-agent"]';else if(!c.agent.name.trim())target='#new-agent-name';else if(!c.chosenAvatar)target='#create-form [name="avatar"]';else if(!c.chosenColor)target='#create-form .color-field';else target='#create-next';}
    if(t.step===2)target=modal?(c?.instructionsEdited?'#create-next':'#create-form [name="instructions"]'):'[data-action="new-agent"]';
    if(t.step===3)target=modal?'#create-next':'[data-action="new-agent"]';
    if([4,9].includes(t.step))target=chatDraft().trim()?'#task-form button[type="submit"]':'[data-prompt="Summarize the sample document"]';
    if(t.step===5)target='.activity-panel [data-view="laboratory"]';
    if(t.step===6)target='#output-details > summary';
    if(t.step===7){const f=document.getElementById('evaluation-form');target=!f?.elements.accuracy.value?'[name="accuracy"]':!f?.elements.coverage.value?'[name="coverage"]':'#evaluation-form button[type="submit"]';}
    if(t.step===8)target=configDraft()?.instructions!==undefined&&configDraft().instructions!==agent().instructions?'#config-form button[type="submit"]':'[data-action="add-risk"]';
    if(t.step===10)target='[data-action="compare"]';
    const element=target?document.querySelector(target):null;if(element)element.classList.add('highlight');else{const nav=document.querySelector(`[data-view="${steps[t.step]?.view}"]`);nav?.classList.add('highlight');}
  }
  function finishCreation(){const c=state.ui.creation;const a=c.agent;const err=document.getElementById('create-error');if(c.phase===0){if(!a.name.trim()){err.textContent='Give your new agent a name.';return;}if(liveTutorial()&&state.tutorial.step===1&&(!c.chosenAvatar||!c.chosenColor)){err.textContent='Choose an avatar shape and a color to make this new agent recognizable.';applyHighlights();return;}c.phase=1;advance('identity','Your new identity is drafted. No existing agent has changed.');}
    else if(c.phase===1){if(!a.role.trim()||!a.instructions.trim()){err.textContent='Add a role and instructions before reviewing.';return;}if(liveTutorial()&&state.tutorial.step===2&&!a.tool){err.textContent='Enable the Sample document tool for this tutorial task.';return;}c.phase=2;advance('configure','Instructions and read-only tool access are ready. Review before creating.');}
    else {a.name=a.name.trim();a.instructions=a.instructions.trim();if(liveTutorial())a.practice=true;state.agents.push(a);state.selected=a.id;selectedRun=null;if(liveTutorial()&&state.tutorial.step===3){state.tutorial.agentId=a.id;advance('create',`${a.name} now has a separate workstation and history.`);}state.ui.creation=null;modal=false;state.ui.notice=`${a.name} has joined your Workshop!`;save();go('workshop');toast(state.ui.notice);return;}save();render();document.querySelector('#create-form input,#create-form textarea,#create-next')?.focus();
  }

  function bind(){
    document.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>{state.tutorial.step=Number(el.dataset.lesson);state.tutorial.active=true;guide();});
    document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>go(el.dataset.view));
    document.querySelectorAll('[data-select-agent]').forEach(el=>el.onclick=()=>selectAgent(el.dataset.selectAgent));
    document.querySelectorAll('[data-prompt]').forEach(el=>el.onclick=()=>{state.drafts.chats[agent().id]=el.dataset.prompt;save();const input=document.getElementById('task-input');input.value=chatDraft();input.focus();applyHighlights();});
    document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{switch(el.dataset.action){
      case'new-agent':if(!state.ui.creation){const fresh=makeAgent('',state.agents.length);const used=new Set(state.agents.map(a=>a.color));const preferred=identity.palette.find(c=>!used.has(c.value)&&c.value===identity.defaults('',state.agents.length).color)||identity.palette.find(c=>!used.has(c.value));if(preferred)fresh.color=preferred.value;state.ui.creation={agent:fresh,phase:0,chosenAvatar:false,chosenColor:false};}modal=true;save();render();document.getElementById('new-agent-name')?.focus();break;
      case'close-modal':modal=false;render();break;
      case'create-back':state.ui.creation.phase=Math.max(0,state.ui.creation.phase-1);if(liveTutorial()&&state.tutorial.step>1&&state.tutorial.step<=3)state.tutorial.step--;save();render();break;
      case'dismiss-notice':state.ui.notice='';save();render();break;
      case'start-tutorial':case'restart-tutorial':startTutorial();break;
      case'continue-tutorial':case'guide-me':guide();break;
      case'tutorial-help':state.tutorial.help=true;modal=false;save();guide();break;
      case'tutorial-back':state.tutorial.step=Math.max(0,state.tutorial.step-1);state.tutorial.lastSuccess='Revisiting a previous action.';modal=false;guide();break;
      case'tutorial-next':if(state.tutorial.progress?.[state.tutorial.step])state.tutorial.step++;modal=false;save();render();break;
      case'skip-step':{const t=state.tutorial;t.progress||={};if(t.progress[t.step]!=='completed')t.progress[t.step]='skipped';t.step=Math.min(steps.length,t.step+1);t.lastSuccess='Action skipped, not marked completed.';t.help=true;modal=false;save();render();break;}
      case'prepare-practice':preparePractice();break;
      case'reset-experiment':resetExperiment();break;
      case'pause-tutorial':state.tutorial.paused=true;save();render();break;
      case'skip-tutorial':modal=false;state.tutorial.active=false;state.tutorial.paused=true;save();render();break;
      case'toggle-tutorials':state.settings.tutorialDisabled=!state.settings.tutorialDisabled;save();render();break;
      case'explanation':state.settings.advanced=!state.settings.advanced;save();render();break;
      case'pause':runtime().pause();break;case'resume':runtime().resume();break;case'cancel':runtime().cancel();break;
      case'retry':beginTask(currentRun().task);break;case'compare':compare();break;
      case'failure-lesson':preparePractice();failureNext.add(agent().id);go('blueprint');toast(`Practice failure enabled for ${agent().name}’s next run.`);break;
      case'add-risk':{const form=document.getElementById('config-form');const input=form.elements.instructions;if(!/risk|uncertain|limitation/i.test(input.value))input.value=input.value.trim()+' Include risks and uncertainty.';else if(!/next steps?/i.test(input.value))input.value=input.value.trim()+' Include next steps.';else input.value=input.value.trim()+' Provide a detailed summary.';rememberForm(form);input.focus();break;}
      case'export':{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ai-agent-workshop.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break;}
      case'import':document.getElementById('import-file').click();break;
    }});
    document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{const form=el.closest('form');form.elements.color.value=el.dataset.color;if(form.id==='create-form')state.ui.creation.chosenColor=true;rememberForm(form);});
    const create=document.getElementById('create-form');if(create){create.oninput=e=>{if(e.target.name==='avatar')state.ui.creation.chosenAvatar=true;if(e.target.name==='color')state.ui.creation.chosenColor=true;if(e.target.name==='instructions')state.ui.creation.instructionsEdited=true;rememberForm(create);};create.onchange=create.oninput;create.onsubmit=e=>{e.preventDefault();rememberForm(create);finishCreation();};}
    const config=document.getElementById('config-form');if(config){config.oninput=()=>rememberForm(config);config.onchange=config.oninput;config.onsubmit=e=>{e.preventDefault();const updated=readForm(config,agent());if(!updated.name.trim()||!updated.role.trim()||!updated.instructions.trim()||!updated.document.trim()){formError='Name, role, instructions, and sample document cannot be blank.';render();return;}const t=state.tutorial;const oldInstructions=agent().instructions;Object.assign(agent(),updated,{name:updated.name.trim(),version:agent().version+1});delete state.drafts.agents[agent().id];state.ui.notice=`Changes saved for ${agent().name}. Identity and history preserved.`;if(liveTutorial()&&t.step===8&&agent().id===t.agentId){if(oldInstructions!==agent().instructions&&/risk|uncertain|limitation|next step|detailed/i.test(agent().instructions)){advance('improve','Instructions updated. The original run still has its original configuration.');state.drafts.chats[agent().id]=state.runs.find(r=>r.id===t.baseline)?.task||'Summarize the sample document';save();go('workshop');return;}else toast('For this experiment, add a risk or uncertainty instruction so the simulator’s output changes.');}save();render();toast(state.ui.notice);};}
    document.getElementById('task-form')?.addEventListener('submit',e=>{e.preventDefault();beginTask(document.getElementById('task-input').value);});
    const input=document.getElementById('task-input');if(input){input.oninput=()=>{state.drafts.chats[agent().id]=input.value;save();applyHighlights();};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();beginTask(input.value);}};}
    document.getElementById('agent-select')?.addEventListener('change',e=>selectAgent(e.target.value));
    document.getElementById('room-zoom')?.addEventListener('change',e=>{state.ui.zoom=Number(e.target.value);save();render();});
    document.getElementById('run-select')?.addEventListener('change',e=>{selectedRun=e.target.value;render();});
    document.getElementById('practice-failure')?.addEventListener('change',e=>{if(e.target.checked)failureNext.add(agent().id);else failureNext.delete(agent().id);});
    document.querySelectorAll('.trace-item').forEach(el=>el.addEventListener('toggle',()=>{if(!el.isConnected)return;if(el.open)openEvents.add(el.dataset.eventId);else openEvents.delete(el.dataset.eventId);}));
    const output=document.getElementById('output-details');if(output)output.ontoggle=()=>{if(!output.isConnected)return;const r=currentRun();if(!r)return;if(output.open){openEvents.add('output-'+r.id);if(r.status==='completed'&&r.id===state.tutorial.baseline&&advance('inspect','You inspected the completed output. Now evaluate it against the source.'))render();}else openEvents.delete('output-'+r.id);};
    const evaluation=document.getElementById('evaluation-form');if(evaluation){evaluation.oninput=()=>{const f=new FormData(evaluation);state.drafts.evaluations[currentRun().id]={accuracy:f.get('accuracy'),coverage:f.get('coverage'),notes:f.get('notes')};save();applyHighlights();};evaluation.onchange=evaluation.oninput;evaluation.onsubmit=e=>{e.preventDefault();const f=new FormData(evaluation);const accuracy=Number(f.get('accuracy')),coverage=Number(f.get('coverage'));if(!accuracy||!coverage||currentRun().status!=='completed'){toast('Choose both scores for a completed run.');return;}currentRun().evaluation={accuracy,coverage,notes:f.get('notes'),at:new Date().toISOString()};delete state.drafts.evaluations[currentRun().id];if(currentRun().id===state.tutorial.baseline&&advance('score','Evaluation saved. Next, change one instruction and repeat the experiment.')){save();go('blueprint');}else{save();render();toast('Evaluation saved with this agent’s run.');}};}
    document.getElementById('import-file')?.addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('Backup is too large (maximum 10 MB).');const data=JSON.parse(await file.text());importBackup(data);}catch(error){toast('Could not import: '+error.message);}});
    if(modal){const dialog=document.querySelector('.dialog');dialog.onkeydown=e=>{if(e.key==='Escape'){modal=false;render();}if(e.key==='Tab'){const items=[...dialog.querySelectorAll('input:not([disabled]),textarea,select:not([disabled]),button,summary')].filter(x=>!x.closest('details:not([open])')||x.tagName==='SUMMARY');const at=items.indexOf(document.activeElement);if(e.shiftKey&&at===0){e.preventDefault();items.at(-1).focus();}else if(!e.shiftKey&&at===items.length-1){e.preventDefault();items[0].focus();}}};}
  }
  function importBackup(data){
    if(!Array.isArray(data.agents)||!Array.isArray(data.runs)||!Array.isArray(data.messages)||data.agents.length>200||data.runs.length>16000||data.messages.length>40000)throw Error('Choose a valid Workshop JSON export.');
    const validId=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(x);
    const validText=(x,max=10000)=>typeof x==='string'&&x.length<=max;
    const validDate=x=>typeof x==='string'&&Number.isFinite(Date.parse(x));
    const statuses=['idle','queued','working','using-tool','completed','failed','cancelled','paused'];
    function cleanAgent(item,index){if(!item||!validId(item.id)||!validText(item.name,32)||!item.name.trim()||!validText(item.instructions,2000)||!validText(item.document)||!validText(item.role||'Document explorer',80))throw Error('The backup contains an invalid agent.');return identity.normalize({id:item.id,name:item.name,role:item.role||'Document explorer',instructions:item.instructions,document:item.document,tool:item.tool===true,format:item.format==='detailed'?'detailed':'concise',version:Number.isInteger(item.version)&&item.version>0?item.version:1,color:item.color,avatar:item.avatar,accessory:item.accessory,symbol:item.symbol},index);}
    // Validate every record before mutating local data. IDs remain safe in DOM attributes.
    const cleanAgents=data.agents.map(cleanAgent);const importedIds=new Set(cleanAgents.map(a=>a.id));if(importedIds.size!==cleanAgents.length)throw Error('Duplicate agent IDs in the backup.');
    const cleanRuns=data.runs.map(item=>{if(!item||!validId(item.id)||!importedIds.has(item.agentId)||!validText(item.task,2000)||!validDate(item.started)||!statuses.includes(item.status)||!Array.isArray(item.events)||item.events.length>2000)throw Error('The backup contains an invalid run.');const config=cleanAgent(item.config,0);if(config.id!==item.agentId)throw Error('A run has a mismatched agent configuration.');
      const events=item.events.map(e=>{if(!e||!validId(e.id)||!validDate(e.at)||!validText(e.type,100)||!/^[a-zA-Z0-9_.-]+$/.test(e.type)||!validText(e.label,500)||!statuses.includes(e.state)||!e.data||typeof e.data!=='object'||Array.isArray(e.data))throw Error('The backup contains an invalid execution event.');return {id:e.id,runId:item.id,agentId:item.agentId,at:e.at,type:e.type,state:e.state,label:e.label,data:e.data};});
      let evaluation=null;if(item.evaluation){const e=item.evaluation;if(![1,2,3,4,5].includes(Number(e.accuracy))||![1,2,3,4,5].includes(Number(e.coverage))||!validText(e.notes||'',2000))throw Error('The backup contains an invalid evaluation.');evaluation={accuracy:Number(e.accuracy),coverage:Number(e.coverage),notes:e.notes||'',at:e.at};}
      const copy={id:item.id,agentId:item.agentId,task:item.task,config,status:item.status,started:item.started,finished:item.finished,events,evaluation};if(['working','using-tool','paused','queued'].includes(copy.status)){copy.status='cancelled';copy.events.push({id:uid(),type:'task.interrupted',state:'cancelled',at:new Date().toISOString(),label:'Imported unfinished run',data:{message:'An exported run cannot continue execution. Start a new task.'}});}return copy;
    });
    const cleanMessages=data.messages.map(m=>{if(!m||!validId(m.id)||!importedIds.has(m.agentId)||!validText(m.text,20000)||!validDate(m.at)||!['user','agent'].includes(m.role))throw Error('The backup contains an invalid conversation.');return {id:m.id,agentId:m.agentId,role:m.role,text:m.text,at:m.at};});
    const added=new Set(cleanAgents.filter(a=>!state.agents.some(local=>local.id===a.id)).map(a=>a.id));state.agents.push(...cleanAgents.filter(a=>added.has(a.id)));
    state.runs.push(...cleanRuns.filter(r=>added.has(r.agentId)&&!state.runs.some(local=>local.id===r.id)));state.runs.sort((a,b)=>new Date(b.started)-new Date(a.started));
    state.messages.push(...cleanMessages.filter(m=>added.has(m.agentId)&&!state.messages.some(local=>local.id===m.id)));
    state.ui.notice=`Imported ${added.size} agents. Existing identities and histories were kept unchanged.`;save();go('workshop');toast(state.ui.notice);
  }
  save();render();
})();

</script></body>
